# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://docs.github.com/en/actions/publishing-packages/publishing-nodejs-packages

name: Node.js Package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - run: npm ci
      - run: npm install -g npm@11
      - run: npm publish
      - name: Verify published package
        continue-on-error: true
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "Checking epic-css@$VERSION"

          for i in {1..6}; do
            if npm view "epic-css@$VERSION" version \
              --registry=https://registry.npmjs.org/; then
              echo "Package verified successfully!"
              exit 0
            fi

            echo "Not available yet. Retrying in 10 seconds..."
            sleep 10
          done

          echo "Package not yet visible on npm."
          exit 1
